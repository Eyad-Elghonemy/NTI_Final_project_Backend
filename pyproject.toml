[project]
name = "Car-Damage-detector"
version = "1.0.0"
description = "Car Damage Detector — API"
requires-python = "==3.12.*"
dependencies = [
    "uvicorn==0.49.0",
    "fastapi[standard]==0.139.0",
    "ultralytics==8.4.142",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "opencv-python-headless==4.10.0.84",
    "Pillow==10.4.0",
    "google-genai==1.28.0",
]

# ultralytics depends on opencv-python, which needs libGL (not present on
# headless cloud servers). This forces uv to substitute it with
# opencv-python-headless everywhere in the dependency tree, so the
# regular opencv-python package never gets installed at all.
[tool.uv]
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
]